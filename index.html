<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barakat Perfumes POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen font-sans flex flex-col justify-between overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-emerald-900 text-white p-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fas fa-spray-can text-amber-400 text-xl"></i>
            <h1 class="font-bold text-lg tracking-wide">BARAKAT PERFUMES <span class="text-xs font-normal text-emerald-200">| Point of Sale</span></h1>
        </div>
        <div class="flex items-center space-x-3 text-xs">
            <span id="connection-status" class="bg-emerald-800 text-emerald-200 px-2 py-1 rounded flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online
            </span>
            <button onclick="toggleSalesHistoryModal()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-3 py-1 rounded shadow transition">
                <i class="fas fa-history mr-1"></i> Sales History
            </button>
        </div>
    </header>

    <!-- Main Application Body -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Left Column: Products & Quick Search -->
        <div class="w-7/12 p-4 flex flex-col border-r border-gray-200 bg-white">
            <div class="mb-3 flex gap-2">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                    <input type="text" id="product-search" onkeyup="filterProducts()" placeholder="Search products by name or barcode..." class="w-full pl-9 pr-3 py-1.5 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-emerald-600 outline-none">
                </div>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-3 gap-3 overflow-y-auto flex-1 pr-1">
                <!-- Products dynamically rendered here -->
            </div>
        </div>

        <!-- Right Column: Customer Profile & Shopping Cart -->
        <div class="w-5/12 bg-gray-50 flex flex-col justify-between">

            <!-- Customer & Loyalty Panel -->
            <div class="p-3 border-b border-gray-200 bg-emerald-50/50 space-y-2 relative">
                <label class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider">Customer & Loyalty Profile</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="cust-name-input" list="customers-list" oninput="handleCustomerInput('name')" placeholder="Customer Name" class="border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                    <input type="text" id="cust-phone-input" list="customers-list" oninput="handleCustomerInput('phone')" placeholder="Phone Number" class="border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                </div>
                
                <!-- Dynamic Datalist Options -->
                <datalist id="customers-list"></datalist>

                <!-- Loyalty Points Widget -->
                <div id="loyalty-widget" class="bg-white p-2 rounded border border-emerald-200 flex justify-between items-center text-xs">
                    <div>
                        <span class="text-gray-500">Points Balance:</span>
                        <strong id="cust-pts-balance" class="text-emerald-700 font-bold ml-1">0 Pts</strong>
                    </div>
                    <button id="btn-redeem-pts" onclick="redeemLoyaltyPoints()" disabled class="bg-gray-300 text-gray-500 text-[10px] font-bold px-2 py-1 rounded cursor-not-allowed">
                        Redeem (100 pts = 1 BHD)
                    </button>
                </div>
            </div>

            <!-- Cart Items List -->
            <div class="p-3 flex-1 overflow-y-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b text-gray-400 font-semibold uppercase text-[10px]">
                            <th class="pb-2">Item</th>
                            <th class="pb-2 text-center">Qty</th>
                            <th class="pb-2 text-right">Total</th>
                            <th class="pb-2 text-center"></th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body">
                        <!-- Cart items dynamically rendered here -->
                    </tbody>
                </table>
            </div>

            <!-- Cart Summary & Actions -->
            <div class="p-4 bg-white border-t border-gray-200 space-y-2 shadow-inner">
                <div class="flex justify-between text-xs text-gray-600">
                    <span>Subtotal (Excl. VAT)</span>
                    <span id="cart-subtotal">0.000 BHD</span>
                </div>
                <div class="flex justify-between text-xs text-gray-600">
                    <span>VAT (10%)</span>
                    <span id="cart-vat">0.000 BHD</span>
                </div>
                <div class="flex justify-between text-xs text-red-600" id="discount-row" style="display: none;">
                    <span>Discount / Points Red.</span>
                    <span id="cart-discount">-0.000 BHD</span>
                </div>
                <div class="flex justify-between text-sm font-bold text-gray-800 pt-1 border-t">
                    <span>Net Total</span>
                    <span id="cart-net-total" class="text-emerald-800 text-base">0.000 BHD</span>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="clearCart()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs py-2 rounded font-semibold transition">
                        Clear Cart
                    </button>
                    <button onclick="openPaymentModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs py-2 rounded font-semibold shadow transition">
                        Pay Now
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-1/3 p-5 space-y-4 shadow-xl">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2 flex justify-between items-center">
                <span>Complete Transaction</span>
                <button onclick="closePaymentModal()" class="text-gray-400 hover:text-gray-600 text-sm">&times;</button>
            </h2>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600">Select Payment Method</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPaymentType('CASH')" id="pay-btn-cash" class="pay-option border border-emerald-600 text-emerald-800 font-bold p-2 text-xs rounded text-center">Cash</button>
                    <button onclick="setPaymentType('BENEFIT')" id="pay-btn-benefit" class="pay-option border border-gray-300 text-gray-700 p-2 text-xs rounded text-center">BenefitPay</button>
                    <button onclick="setPaymentType('CARD')" id="pay-btn-card" class="pay-option border border-gray-300 text-gray-700 p-2 text-xs rounded text-center">Card</button>
                </div>
            </div>

            <div class="space-y-1 text-xs pt-2">
                <div class="flex justify-between text-gray-600">
                    <span>Total Due:</span>
                    <strong id="modal-total-due" class="text-gray-800">0.000 BHD</strong>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-3">
                <button onclick="processSale('PRINT')" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs py-2 rounded font-semibold">
                    <i class="fas fa-print mr-1"></i> Pay & Print
                </button>
                <button onclick="processSale('WHATSAPP')" class="bg-green-600 hover:bg-green-700 text-white text-xs py-2 rounded font-semibold">
                    <i class="fab fa-whatsapp mr-1"></i> Pay & WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Sales History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-2/3 p-5 space-y-4 shadow-xl max-h-[80vh] flex flex-col">
            <h2 class="text-base font-bold text-gray-800 border-b pb-2 flex justify-between items-center">
                <span>Recent Transactions</span>
                <button onclick="toggleSalesHistoryModal()" class="text-gray-400 hover:text-gray-600 text-sm">&times;</button>
            </h2>

            <div class="overflow-y-auto flex-1">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-50 border-b sticky top-0">
                        <tr>
                            <th class="p-2">Receipt ID</th>
                            <th class="p-2">Date/Time</th>
                            <th class="p-2">Customer</th>
                            <th class="p-2">Total</th>
                            <th class="p-2">Payment</th>
                            <th class="p-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- Dynamic History Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- Supabase Config ---
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_URL.supabase.co"; 
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY"; 
        let supabaseClient = null;

        if (typeof supabase !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.includes("YOUR_SUPABASE_PROJECT_URL")) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // --- Application State ---
        let products = [
            { id: 1, name: 'RIIFFS Freeze EDP 100ml', price: 12.500, barcode: '6291001', category: 'Perfume' },
            { id: 2, name: 'Lattafa Maahir Honor 100ml', price: 10.000, barcode: '6291002', category: 'Perfume' },
            { id: 3, name: 'Aromatix Frost Bite EDP', price: 15.000, barcode: '6291003', category: 'Perfume' },
            { id: 4, name: 'Giorgio Armani Aqua Di Gio', price: 42.000, barcode: '6291004', category: 'Perfume' }
        ];

        let customers = [];
        let selectedCustomerId = null;
        let cart = [];
        let salesHistory = JSON.parse(localStorage.getItem('pos_sales_history') || '[]');
        let currentCustomerPoints = 0;
        let pointsRedeemedCount = 0;
        let discountAmount = 0;
        let selectedPaymentType = 'CASH';

        // --- Init Lifecycle ---
        window.onload = () => {
            renderProducts(products);
            renderCart();
            fetchCustomers();
        };

        // --- Customer Logic & Dropdown ---
        async function fetchCustomers() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('contacts').select('*');
                if (!error && data) {
                    customers = data;
                    populateCustomerDatalist();
                }
            } catch (err) {
                console.error('Error fetching contacts:', err);
            }
        }

        function populateCustomerDatalist() {
            const datalist = document.getElementById('customers-list');
            if (!datalist) return;
            datalist.innerHTML = '';

            customers.forEach(c => {
                const option = document.createElement('option');
                option.value = c.phone;
                option.label = `${c.name} (${c.phone})`;
                datalist.appendChild(option);
            });
        }

        function handleCustomerInput(field) {
            const nameVal = document.getElementById('cust-name-input').value.trim();
            const phoneVal = document.getElementById('cust-phone-input').value.trim();

            const match = customers.find(c => 
                (phoneVal && c.phone === phoneVal) || 
                (nameVal && c.name.toLowerCase() === nameVal.toLowerCase())
            );

            if (match) {
                selectedCustomerId = match.id;
                document.getElementById('cust-name-input').value = match.name;
                document.getElementById('cust-phone-input').value = match.phone;
                currentCustomerPoints = match.loyalty_points || 0;
            } else {
                selectedCustomerId = null;
                currentCustomerPoints = 0;
            }
            updateLoyaltyUI();
        }

        function updateLoyaltyUI() {
            document.getElementById('cust-pts-balance').innerText = `${currentCustomerPoints} Pts`;
            const redeemBtn = document.getElementById('btn-redeem-pts');
            if (currentCustomerPoints >= 100) {
                redeemBtn.disabled = false;
                redeemBtn.className = "bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-bold px-2 py-1 rounded cursor-pointer shadow";
            } else {
                redeemBtn.disabled = true;
                redeemBtn.className = "bg-gray-300 text-gray-500 text-[10px] font-bold px-2 py-1 rounded cursor-not-allowed";
            }
        }

        function redeemLoyaltyPoints() {
            if (currentCustomerPoints < 100) return;
            pointsRedeemedCount += 100;
            currentCustomerPoints -= 100;
            discountAmount += 1.000; // 100 pts = 1 BHD
            updateLoyaltyUI();
            renderCart();
        }

        // --- Product Grid Logic ---
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            items.forEach(p => {
                grid.innerHTML += `
                    <div onclick="addToCart(${p.id})" class="border rounded-md p-3 hover:shadow-md cursor-pointer bg-emerald-50/20 border-emerald-100 flex flex-col justify-between h-28">
                        <div>
                            <span class="text-[10px] text-emerald-600 font-semibold uppercase">${p.category}</span>
                            <h3 class="text-xs font-bold text-gray-800 line-clamp-2">${p.name}</h3>
                        </div>
                        <div class="flex justify-between items-center text-xs font-bold text-emerald-900">
                            <span>${p.price.toFixed(3)} BHD</span>
                            <i class="fas fa-plus-circle text-emerald-600"></i>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('product-search').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.barcode.includes(query));
            renderProducts(filtered);
        }

        // --- Cart Functions ---
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            renderCart();
        }

        function clearCart() {
            cart = [];
            pointsRedeemedCount = 0;
            discountAmount = 0;
            selectedCustomerId = null;
            document.getElementById('cust-name-input').value = '';
            document.getElementById('cust-phone-input').value = '';
            currentCustomerPoints = 0;
            updateLoyaltyUI();
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cart-table-body');
            tbody.innerHTML = '';

            let grossTotal = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                grossTotal += itemTotal;
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="py-2 text-gray-800 font-medium">${item.name}</td>
                        <td class="py-2 text-center">
                            <button onclick="updateQty(${item.id}, -1)" class="px-1.5 py-0.5 bg-gray-200 rounded text-[10px] font-bold">-</button>
                            <span class="px-1">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="px-1.5 py-0.5 bg-gray-200 rounded text-[10px] font-bold">+</button>
                        </td>
                        <td class="py-2 text-right font-semibold">${itemTotal.toFixed(3)} BHD</td>
                        <td class="py-2 text-center">
                            <button onclick="updateQty(${item.id}, -${item.qty})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            const subtotal = Math.max(0, grossTotal - discountAmount) / 1.10;
            const vat = Math.max(0, grossTotal - discountAmount) - subtotal;
            const netTotal = Math.max(0, grossTotal - discountAmount);

            document.getElementById('cart-subtotal').innerText = subtotal.toFixed(3) + ' BHD';
            document.getElementById('cart-vat').innerText = vat.toFixed(3) + ' BHD';
            document.getElementById('cart-net-total').innerText = netTotal.toFixed(3) + ' BHD';

            const discountRow = document.getElementById('discount-row');
            if (discountAmount > 0) {
                discountRow.style.display = 'flex';
                document.getElementById('cart-discount').innerText = `-${discountAmount.toFixed(3)} BHD`;
            } else {
                discountRow.style.display = 'none';
            }
        }

        // --- Payment Modal & Sales Execution ---
        function openPaymentModal() {
            if (cart.length === 0) return alert('Cart is empty!');
            const grossTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const netTotal = Math.max(0, grossTotal - discountAmount);
            document.getElementById('modal-total-due').innerText = netTotal.toFixed(3) + ' BHD';
            document.getElementById('payment-modal').classList.remove('hidden');
            document.getElementById('payment-modal').classList.add('flex');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('flex');
        }

        function setPaymentType(type) {
            selectedPaymentType = type;
            document.querySelectorAll('.pay-option').forEach(btn => {
                btn.className = 'pay-option border border-gray-300 text-gray-700 p-2 text-xs rounded text-center';
            });
            const selectedBtn = document.getElementById(`pay-btn-${type.toLowerCase()}`);
            if (selectedBtn) {
                selectedBtn.className = 'pay-option border border-emerald-600 text-emerald-800 font-bold p-2 text-xs rounded text-center';
            }
        }

        async function processSale(action) {
            const custName = document.getElementById('cust-name-input').value.trim() || 'Walk-in Customer';
            const custPhone = document.getElementById('cust-phone-input').value.trim() || 'N/A';

            const grossTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const netTotalInclusive = Math.max(0, grossTotal - discountAmount);
            const pointsEarned = Math.floor(netTotalInclusive);
            let updatedBalance = currentCustomerPoints - pointsRedeemedCount + pointsEarned;

            // 1. Sync Customer with Supabase
            if (custPhone !== 'N/A' && supabaseClient) {
                if (selectedCustomerId) {
                    await supabaseClient.from('contacts').update({
                        loyalty_points: updatedBalance,
                        last_visit: new Date().toISOString()
                    }).eq('id', selectedCustomerId);
                } else if (custName !== 'Walk-in Customer') {
                    const { data } = await supabaseClient.from('contacts').insert([{
                        name: custName,
                        phone: custPhone,
                        loyalty_points: updatedBalance
                    }]).select();
                    if (data && data.length > 0) selectedCustomerId = data[0].id;
                }
                fetchCustomers();
            }

            // 2. Save Sales Order in Supabase
            const receiptId = 'BP-' + Math.floor(100000 + Math.random() * 900000);
            if (supabaseClient) {
                await supabaseClient.from('sales_orders').insert([{
                    customer_id: selectedCustomerId,
                    customer_name: custName,
                    customer_phone: custPhone,
                    subtotal: netTotalInclusive / 1.10,
                    vat_amount: netTotalInclusive - (netTotalInclusive / 1.10),
                    total_amount: netTotalInclusive,
                    gross_total: grossTotal,
                    discount_amount: discountAmount,
                    payment_method: selectedPaymentType,
                    points_earned: pointsEarned,
                    points_redeemed: pointsRedeemedCount,
                    status: 'COMPLETED'
                }]);
            }

            const saleRecord = {
                receiptId: receiptId,
                timestamp: new Date().toLocaleString(),
                custName: custName,
                custPhone: custPhone,
                items: [...cart],
                grossTotal: grossTotal,
                discountAmount: discountAmount,
                netTotal: netTotalInclusive,
                pointsEarned: pointsEarned,
                pointsBalance: updatedBalance,
                paymentType: selectedPaymentType,
                status: 'COMPLETED'
            };

            salesHistory.unshift(saleRecord);
            localStorage.setItem('pos_sales_history', JSON.stringify(salesHistory));

            if (action === 'PRINT') {
                window.print();
            } else if (action === 'WHATSAPP') {
                alert(`Receipt link created for ${custPhone}`);
            }

            closePaymentModal();
            clearCart();
        }

        // --- Sales History Modal ---
        function toggleSalesHistoryModal() {
            const modal = document.getElementById('history-modal');
            if (modal.classList.contains('hidden')) {
                renderHistoryTable();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';
            salesHistory.forEach(s => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-bold text-emerald-800">${s.receiptId}</td>
                        <td class="p-2 text-gray-500">${s.timestamp}</td>
                        <td class="p-2 font-medium">${s.custName} (${s.custPhone})</td>
                        <td class="p-2 font-bold">${s.netTotal.toFixed(3)} BHD</td>
                        <td class="p-2"><span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-[10px] font-semibold">${s.paymentType}</span></td>
                        <td class="p-2 text-center">
                            <button onclick="alert('Reprinting receipt ${s.receiptId}')" class="text-xs text-emerald-700 hover:underline"><i class="fas fa-print"></i></button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
