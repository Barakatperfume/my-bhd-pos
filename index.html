<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barakat Perfumes - POS System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden text-gray-800 font-sans">

    <!-- TOP BAR -->
    <header class="bg-emerald-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-emerald-800 rounded-full w-9 h-9 flex items-center justify-center font-bold text-lg shadow">
                BP
            </div>
            <h1 class="text-xl font-bold tracking-wide">Barakat Perfumes POS</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openSalesModal()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-2 transition">
                <i class="fa-solid fa-receipt"></i>
                <span>View Sales</span>
            </button>
            <button onclick="openItemsModal()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-2 transition">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>Items Manager</span>
            </button>
            <span id="current-user-badge" class="bg-emerald-900 px-3 py-1.5 rounded-lg text-sm font-medium border border-emerald-700">
                Cashier 1
            </span>
            <button onclick="switchUser()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                Switch PIN
            </button>
        </div>
    </header>

    <!-- MAIN POS INTERFACE -->
    <main class="flex h-[calc(100vh-60px)]">
        
        <!-- LEFT PANEL: CATALOG & SEARCH -->
        <section class="w-7/12 p-4 flex flex-col border-r border-gray-300 bg-gray-50">
            <!-- Search & Barcode -->
            <div class="flex space-x-2 mb-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Search product name, SKU, or barcode..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white shadow-sm">
                </div>
                <button onclick="focusSearch()" class="bg-gray-800 text-white px-4 py-2.5 rounded-xl font-medium hover:bg-gray-700 transition">
                    Scan
                </button>
            </div>

            <!-- Categories Filter -->
            <div id="category-bar" class="flex space-x-2 overflow-x-auto no-scrollbar mb-4 pb-1">
                <button onclick="filterCategory('ALL')" class="cat-btn active-cat bg-emerald-700 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">All Items</button>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-3 gap-3 overflow-y-auto pr-1 flex-1">
                <!-- Dynamic Items -->
            </div>
        </section>

        <!-- RIGHT PANEL: CART & CHECKOUT -->
        <section class="w-5/12 bg-white flex flex-col justify-between p-4 shadow-lg">
            
            <!-- Customer Selection Header -->
            <div>
                <div class="flex justify-between items-center pb-2 border-b border-gray-200">
                    <h2 class="text-lg font-bold text-gray-800">Current Order</h2>
                    <button onclick="clearCart()" class="text-xs text-red-600 font-semibold hover:underline">Clear All</button>
                </div>

                <div class="mt-3 p-3 bg-emerald-50 rounded-xl border border-emerald-200 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-emerald-800 font-bold uppercase tracking-wider">Customer Profile</p>
                        <p id="customer-display-name" class="font-bold text-gray-800 text-sm">Walk-in Customer</p>
                        <p id="customer-display-phone" class="text-xs text-gray-500">No phone attached</p>
                    </div>
                    <button onclick="openCustomerModal()" class="text-xs bg-white text-emerald-800 font-semibold px-3 py-1.5 rounded-lg border border-emerald-300 hover:bg-emerald-100 transition">
                        <i class="fa-solid fa-user-plus mr-1"></i> Search / Add Customer
                    </button>
                </div>

                <!-- Loyalty Points Badge -->
                <div id="loyalty-container" class="mt-2 text-xs flex justify-between items-center px-1 text-gray-600">
                    <span>Points Balance: <strong id="customer-points-val" class="text-emerald-700">0 Pts</strong></span>
                    <button id="redeem-btn" onclick="toggleRedeemPoints()" disabled class="text-xs px-2 py-0.5 rounded bg-gray-200 text-gray-400 cursor-not-allowed">
                        Redeem (Min 100 pts)
                    </button>
                </div>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items-list" class="flex-1 overflow-y-auto my-3 border-t border-b border-gray-100 py-2 space-y-2">
                <div class="h-full flex items-center justify-center text-gray-400 text-sm">
                    Cart is empty.
                </div>
            </div>

            <!-- Totals & Payment Summary -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <div class="space-y-1.5 text-sm">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">BHD 0.000</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>VAT (10%)</span>
                        <span id="summary-vat">BHD 0.000</span>
                    </div>
                    <div id="discount-row" class="flex justify-between text-emerald-600 font-medium hidden">
                        <span>Loyalty Discount</span>
                        <span id="summary-discount">- BHD 0.000</span>
                    </div>
                    <hr class="my-1 border-gray-300">
                    <div class="flex justify-between text-lg font-bold text-gray-900">
                        <span>Total Payable</span>
                        <span id="summary-total" class="text-emerald-800">BHD 0.000</span>
                    </div>
                </div>

                <!-- Payment Action Buttons -->
                <div class="grid grid-cols-3 gap-2 mt-4">
                    <button onclick="processCheckout('CASH')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center shadow transition">
                        <i class="fa-solid fa-money-bill-wave text-lg mb-0.5"></i>
                        <span class="text-xs">CASH</span>
                    </button>
                    <button onclick="processCheckout('CARD')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center shadow transition">
                        <i class="fa-solid fa-credit-card text-lg mb-0.5"></i>
                        <span class="text-xs">CARD</span>
                    </button>
                    <button onclick="processCheckout('BENEFIT_PAY')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl flex flex-col items-center justify-center shadow transition">
                        <i class="fa-solid fa-qrcode text-lg mb-0.5"></i>
                        <span class="text-xs">BENEFIT PAY</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- CUSTOMER SEARCH MODAL -->
    <div id="customer-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white w-1/3 rounded-2xl shadow-xl p-6">
            <h3 class="text-lg font-bold mb-4">Select or Add Customer</h3>
            <input type="text" id="cust-search-input" onkeyup="searchCustomers()" placeholder="Phone number or name..." class="w-full border p-2 rounded-lg mb-3">
            <div id="customer-results-list" class="max-h-48 overflow-y-auto border-t border-b divide-y my-2">
                <!-- Search Results -->
            </div>
            <div class="mt-4 pt-3 border-t">
                <p class="text-xs font-bold text-gray-500 mb-2">ADD NEW CUSTOMER</p>
                <input type="text" id="new-cust-name" placeholder="Full Name" class="w-full border p-2 rounded-lg text-sm mb-2">
                <input type="text" id="new-cust-phone" placeholder="Phone Number" class="w-full border p-2 rounded-lg text-sm mb-3">
                <button onclick="addNewCustomer()" class="w-full bg-emerald-700 text-white py-2 rounded-lg font-bold text-sm">Create & Select</button>
            </div>
            <button onclick="closeCustomerModal()" class="mt-3 text-xs text-gray-500 w-full text-center">Cancel</button>
        </div>
    </div>

    <!-- SCRIPT APPLICATION CODE -->
    <script>
        // SUPABASE INIT
        const SUPABASE_URL = "https://lxyxlecusdjdikozeedx.supabase.co"; // Replace with your active Supabase URL
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // Replace with your anon key
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // STATE MANAGEMENT
        let products = [];
        let cart = [];
        let activeCategory = 'ALL';
        let selectedCustomer = null;
        let pointsRedeemed = 0;
        let discountAmount = 0;
        let activeUser = { id: null, name: 'Cashier 1', role: 'CASHIER' };

        // INITIAL LOAD
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchProducts();
            renderCategories();
        });

        // 1. FETCH PRODUCTS CORRECTED syntax for order()
        async function fetchProducts() {
            try {
                // CORRECT SYNTAX: { ascending: false } instead of 'created_at.desc' string
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
                renderProducts(products);
            } catch (err) {
                console.error('Error loading products:', err.message);
            }
        }

        // 2. RENDER PRODUCTS
        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-gray-400 py-10">No products found</div>`;
                return;
            }

            list.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl p-3 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => addToCart(p);
                
                card.innerHTML = `
                    <div>
                        <span class="text-[10px] font-bold text-emerald-700 uppercase bg-emerald-50 px-2 py-0.5 rounded-md">${p.category || 'General'}</span>
                        <h4 class="font-bold text-gray-800 text-sm mt-1 leading-snug">${p.name}</h4>
                        <p class="text-xs text-gray-400">SKU: ${p.sku}</p>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="font-extrabold text-emerald-800 text-sm">BHD ${parseFloat(p.retail_price).toFixed(3)}</span>
                        <span class="text-xs ${p.stock_quantity > 0 ? 'text-gray-500' : 'text-red-500 font-bold'}">
                            ${p.stock_quantity > 0 ? p.stock_quantity + ' in stock' : 'Out of stock'}
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. CATEGORY RENDERING & FILTERING
        function renderCategories() {
            const categories = ['ALL', ...new Set(products.map(p => p.category).filter(Boolean))];
            const bar = document.getElementById('category-bar');
            bar.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === activeCategory ? 'bg-emerald-700 text-white' : 'bg-white text-gray-600'} px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-gray-200`;
                btn.innerText = cat === 'ALL' ? 'All Items' : cat;
                btn.onclick = () => filterCategory(cat);
                bar.appendChild(btn);
            });
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let filtered = products;

            if (activeCategory !== 'ALL') {
                filtered = filtered.filter(p => p.category === activeCategory);
            }

            if (query) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(query) || 
                    p.sku.toLowerCase().includes(query) || 
                    (p.barcode && p.barcode.toLowerCase().includes(query))
                );
            }

            renderProducts(filtered);
        }

        // 4. CART OPERATIONS
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            renderCart();
        }

        function clearCart() {
            cart = [];
            pointsRedeemed = 0;
            discountAmount = 0;
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = `<div class="h-full flex items-center justify-center text-gray-400 text-sm">Cart is empty.</div>`;
                updateSummary();
                return;
            }

            cart.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm";
                row.innerHTML = `
                    <div class="flex-1">
                        <p class="font-bold text-gray-800 text-xs">${item.name}</p>
                        <p class="text-xs text-gray-500">BHD ${parseFloat(item.retail_price).toFixed(3)}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">-</button>
                        <span class="font-bold text-xs w-4 text-center">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold flex items-center justify-center">+</button>
                    </div>
                    <div class="w-20 text-right font-bold text-emerald-800 text-xs">
                        BHD ${(item.retail_price * item.qty).toFixed(3)}
                    </div>
                `;
                list.appendChild(row);
            });

            updateSummary();
        }

        // 5. SUMMARY CALCULATIONS
        function updateSummary() {
            const gross = cart.reduce((sum, i) => sum + (i.retail_price * i.qty), 0);
            const vat = gross * 0.10; // 10% VAT
            const total = Math.max(0, gross + vat - discountAmount);

            document.getElementById('summary-subtotal').innerText = `BHD ${gross.toFixed(3)}`;
            document.getElementById('summary-vat').innerText = `BHD ${vat.toFixed(3)}`;
            document.getElementById('summary-total').innerText = `BHD ${total.toFixed(3)}`;

            const discRow = document.getElementById('discount-row');
            if (discountAmount > 0) {
                discRow.classList.remove('hidden');
                document.getElementById('summary-discount').innerText = `- BHD ${discountAmount.toFixed(3)}`;
            } else {
                discRow.classList.add('hidden');
            }
        }

        // 6. CHECKOUT RPC INTEGRATION
        async function processCheckout(method) {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            const gross = cart.reduce((sum, i) => sum + (i.retail_price * i.qty), 0);
            const vat = gross * 0.10;
            const total = Math.max(0, gross + vat - discountAmount);
            const pointsEarned = Math.floor(total);

            const payload = {
                p_cashier_id: activeUser.id,
                p_customer_id: selectedCustomer ? selectedCustomer.id : null,
                p_customer_name: selectedCustomer ? selectedCustomer.name : 'Walk-in Customer',
                p_customer_phone: selectedCustomer ? selectedCustomer.phone : 'N/A',
                p_subtotal: gross,
                p_vat_amount: vat,
                p_total_amount: total,
                p_gross_total: gross,
                p_discount_amount: discountAmount,
                p_payment_method: method,
                p_payment_details: {},
                p_points_earned: pointsEarned,
                p_points_redeemed: pointsRedeemed,
                p_items: cart.map(i => ({ id: i.id, qty: i.qty, price: i.retail_price }))
            };

            try {
                const { data, error } = await supabase.rpc('process_pos_sale', payload);
                if (error) throw error;

                alert(`Sale Completed! Order ID: ${data}`);
                clearCart();
                fetchProducts(); // Refresh stock quantities
            } catch (err) {
                console.error("Sale Error:", err.message);
                alert("Checkout Failed: " + err.message);
            }
        }

        // 7. CUSTOMER SEARCH MODAL CORRECTED syntax
        function openCustomerModal() {
            document.getElementById('customer-modal').classList.remove('hidden');
        }

        function closeCustomerModal() {
            document.getElementById('customer-modal').classList.add('hidden');
        }

        async function searchCustomers() {
            const query = document.getElementById('cust-search-input').value;
            if (!query) return;

            // CORRECT SYNTAX: order with object parameter
            const { data, error } = await supabase
                .from('contacts')
                .select('*')
                .or(`name.ilike.%${query}%,phone.ilike.%${query}%`)
                .order('created_at', { ascending: false })
                .limit(5);

            if (error) return;

            const res = document.getElementById('customer-results-list');
            res.innerHTML = '';
            data.forEach(c => {
                const item = document.createElement('div');
                item.className = "p-2 hover:bg-gray-100 cursor-pointer flex justify-between text-sm";
                item.onclick = () => selectCustomer(c);
                item.innerHTML = `<span>${c.name} (${c.phone})</span><span class="font-bold text-emerald-700">${c.loyalty_points || 0} pts</span>`;
                res.appendChild(item);
            });
        }

        function selectCustomer(cust) {
            selectedCustomer = cust;
            document.getElementById('customer-display-name').innerText = cust.name;
            document.getElementById('customer-display-phone').innerText = cust.phone;
            document.getElementById('customer-points-val').innerText = `${cust.loyalty_points || 0} Pts`;
            closeCustomerModal();
        }

        function focusSearch() {
            document.getElementById('search-input').focus();
        }

        function switchUser() {
            const pin = prompt("Enter Cashier PIN:");
            if (pin) alert("User switched successfully");
        }
    </script>
</body>
</html>
