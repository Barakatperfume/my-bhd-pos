<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdn.tailwindcss.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
    <title>Barakat Perfumes POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Media Print Isolation & Single-Page Fit Fix */
        @media print {
            body > * { display: none !important; }
            #print-container, #print-container * { display: block !important; visibility: visible !important; }
            #print-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Isolated Container for Printing -->
    <div id="print-container" class="hidden"></div>

    <!-- Top Navigation Bar -->
    <header class="bg-emerald-700 text-white p-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-xl tracking-wide">Barakat Perfumes POS</span>
            <span id="role-badge" class="bg-emerald-900 text-emerald-200 text-xs px-2 py-1 rounded-full uppercase tracking-wider font-semibold">Cashier</span>
        </div>
        <div class="flex items-center space-x-2">
            <span id="user-name" class="text-sm font-medium hidden sm:inline">Cashier 1</span>
            <button onclick="switchUser()" class="bg-emerald-800 hover:bg-emerald-900 text-white text-xs px-3 py-1.5 rounded transition">Switch PIN</button>
        </div>
    </header>

    <!-- Main POS Interface Split View -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left Panel: Product Search, Scanner & Catalog -->
        <div class="w-full md:w-3/5 lg:w-2/3 p-4 flex flex-col h-full overflow-hidden">
            
            <!-- Universal Search & Camera Scan Bar -->
            <div class="flex space-x-2 mb-4">
                <div class="relative flex-1">
                    <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Search name or scan barcode..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm shadow-sm">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <button onclick="toggleCameraScanner()" class="bg-gray-800 hover:bg-black text-white px-4 py-2.5 rounded-lg flex items-center space-x-1 shadow text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l0.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l0.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="hidden sm:inline">Scan</span>
                </button>
            </div>

            <!-- In-App Camera Viewfinder Container -->
            <div id="camera-reader-wrapper" class="hidden mb-4 bg-black rounded-lg overflow-hidden relative max-h-48">
                <div id="reader" class="w-full"></div>
                <button onclick="toggleCameraScanner()" class="absolute top-2 right-2 bg-red-600 text-white px-2 py-1 text-xs rounded shadow">Close Camera</button>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="flex-1 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 overflow-y-auto no-scrollbar pr-1">
                <!-- Product Cards dynamically rendered here -->
            </div>
        </div>

        <!-- Right Panel: Cart Register & Checkout -->
        <div class="w-full md:w-2/5 lg:w-1/3 bg-white border-l border-gray-200 flex flex-col h-full shadow-lg">
            
            <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-bold text-gray-700">Current Order</h2>
                <button onclick="clearCart()" class="text-xs text-red-600 hover:text-red-800 font-medium">Clear All</button>
            </div>

            <!-- Customer Selection & Loyalty Points Panel -->
            <div class="p-3 border-b border-gray-200 bg-emerald-50/50 space-y-2">
                <label class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider">Customer & Loyalty Profile</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="cust-name-input" placeholder="Customer Name" class="border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                    <input type="text" id="cust-phone-input" oninput="lookupCustomerPoints()" placeholder="Phone Number" class="border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-500 outline-none">
                </div>
                
                <!-- Loyalty Points Widget -->
                <div id="loyalty-widget" class="bg-white p-2 rounded border border-emerald-200 flex justify-between items-center text-xs">
                    <div>
                        <span class="text-gray-500">Points Balance:</span>
                        <strong id="cust-pts-balance" class="text-emerald-700 font-bold ml-1">0 Pts</strong>
                    </div>
                    <button id="btn-redeem-pts" onclick="redeemLoyaltyPoints()" disabled class="bg-gray-300 text-gray-500 text-[10px] font-bold px-2 py-1 rounded cursor-not-allowed">
                        Redeem (100 pts = 1 BHD)
                    </button>
                </div>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar divide-y divide-gray-100">
                <!-- Cart items dynamically rendered here -->
            </div>

            <!-- Pricing Summary & Discount Controls Footer -->
            <div class="p-4 bg-gray-50 border-t border-gray-200 space-y-2">
                
                <!-- Discount Control Panel -->
                <div class="bg-white p-2 rounded-lg border border-gray-200 space-y-1.5 shadow-sm">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-gray-700 uppercase">Apply Discount</label>
                        <div class="flex space-x-1">
                            <button id="disc-type-bhd" onclick="setDiscountType('FIXED')" class="px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-600 text-white">BHD</button>
                            <button id="disc-type-pct" onclick="setDiscountType('PERCENT')" class="px-2 py-0.5 text-[10px] font-bold rounded bg-gray-200 text-gray-700">%</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="discount-title" placeholder="Title (e.g. Promo)" class="border border-gray-300 rounded px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                        <input type="number" id="discount-val" step="0.001" oninput="updateCartUI()" placeholder="Amount / %" class="border border-gray-300 rounded px-2 py-1 text-xs text-right font-bold outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="flex justify-between text-xs text-gray-600">
                    <span>Gross Total</span>
                    <span id="summary-gross" class="font-semibold">BHD 0.000</span>
                </div>
                <div id="row-discount" class="flex justify-between text-xs text-red-600 hidden">
                    <span id="label-discount-title">Discount</span>
                    <span id="summary-discount" class="font-semibold">-BHD 0.000</span>
                </div>
                <div class="flex justify-between text-xs text-gray-600">
                    <span>Subtotal (Excl. VAT)</span>
                    <span id="summary-subtotal" class="font-semibold">BHD 0.000</span>
                </div>
                <div class="flex justify-between text-xs text-gray-600">
                    <span>VAT (10% Incl.)</span>
                    <span id="summary-vat" class="font-semibold">BHD 0.000</span>
                </div>
                <div class="flex justify-between text-lg font-bold text-gray-900 pt-2 border-t border-gray-200">
                    <span>Total Amount</span>
                    <span id="summary-total" class="text-emerald-700">BHD 0.000</span>
                </div>

                <!-- Charge / Checkout Button -->
                <button onclick="openPaymentModal()" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition text-center flex justify-between px-4">
                    <span>PAY NOW</span>
                    <span id="btn-total">BHD 0.000</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Payment & Receipt Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-5 space-y-4 my-auto">
            <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Complete Payment</h3>
            
            <div class="text-center py-2 bg-emerald-50 rounded-lg">
                <p class="text-xs text-emerald-800 uppercase font-semibold tracking-wider">Total Amount Due</p>
                <p id="modal-total" class="text-2xl font-black text-emerald-700">BHD 0.000</p>
            </div>

            <!-- Payment Type Selection -->
            <div>
                <label class="text-xs font-semibold text-gray-600 uppercase">Payment Option</label>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button id="mode-single-btn" onclick="setPaymentType('SINGLE')" class="border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-bold py-2 text-xs rounded-lg text-center">Single Method</button>
                    <button id="mode-split-btn" onclick="setPaymentType('SPLIT')" class="border border-gray-300 text-gray-700 font-bold py-2 text-xs rounded-lg text-center">Split Payment</button>
                </div>
            </div>

            <!-- Single Payment Mode Container -->
            <div id="single-payment-container" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase">Method</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button id="btn-single-cash" onclick="setSingleMethod('CASH')" class="pay-method-btn border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-bold py-2 text-xs rounded-lg text-center">CASH</button>
                        <button id="btn-single-card" onclick="setSingleMethod('CARD')" class="pay-method-btn border border-gray-300 text-gray-700 font-bold py-2 text-xs rounded-lg text-center">CARD</button>
                        <button id="btn-single-benefit" onclick="setSingleMethod('BENEFIT_PAY')" class="pay-method-btn border border-gray-300 text-gray-700 font-bold py-2 text-xs rounded-lg text-center">BENEFIT</button>
                    </div>
                </div>

                <div id="single-cash-wrapper">
                    <label class="text-xs font-semibold text-gray-600 uppercase">Cash Tendered (BHD)</label>
                    <input type="number" id="cash-tendered" step="0.001" oninput="calculateSingleChange()" placeholder="0.000" class="w-full mt-1 border border-gray-300 rounded-lg p-2 text-right font-bold text-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <div class="flex justify-between text-sm mt-2 text-gray-700">
                        <span>Change Due:</span>
                        <span id="change-due" class="font-bold text-blue-600">BHD 0.000</span>
                    </div>
                </div>
            </div>

            <!-- Split Payment Mode Container -->
            <div id="split-payment-container" class="hidden space-y-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <!-- Primary Payment Selection -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase">1. Select Primary Payment Method</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button id="btn-split-pri-cash" onclick="setSplitPrimaryMethod('CASH')" class="split-pri-btn border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-bold py-1.5 text-xs rounded-lg text-center">CASH</button>
                        <button id="btn-split-pri-card" onclick="setSplitPrimaryMethod('CARD')" class="split-pri-btn border border-gray-300 text-gray-700 font-bold py-1.5 text-xs rounded-lg text-center">CARD</button>
                        <button id="btn-split-pri-benefit" onclick="setSplitPrimaryMethod('BENEFIT_PAY')" class="split-pri-btn border border-gray-300 text-gray-700 font-bold py-1.5 text-xs rounded-lg text-center">BENEFIT</button>
                    </div>
                </div>

                <div>
                    <label id="label-split-pri-amount" class="text-xs font-semibold text-gray-600 uppercase">Primary Paid Amount (BHD)</label>
                    <input type="number" id="split-pri-amount" step="0.001" oninput="calculateSplitBalance()" placeholder="0.000" class="w-full mt-1 border border-gray-300 rounded-lg p-2 text-right font-bold text-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg flex justify-between items-center text-sm font-bold text-blue-900">
                    <span>Remaining Balance:</span>
                    <span id="split-remaining-balance" class="text-base text-blue-700">BHD 0.000</span>
                </div>

                <!-- Secondary Payment Selection -->
                <div>
                    <label class="text-xs font-semibold text-gray-600 uppercase">2. Pay Balance Using</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button id="btn-split-sec-cash" onclick="setSplitSecondaryMethod('CASH')" class="split-sec-btn border border-gray-300 text-gray-700 font-bold py-1.5 text-xs rounded-lg text-center">CASH</button>
                        <button id="btn-split-sec-card" onclick="setSplitSecondaryMethod('CARD')" class="split-sec-btn border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-bold py-1.5 text-xs rounded-lg text-center">CARD</button>
                        <button id="btn-split-sec-benefit" onclick="setSplitSecondaryMethod('BENEFIT_PAY')" class="split-sec-btn border border-gray-300 text-gray-700 font-bold py-1.5 text-xs rounded-lg text-center">BENEFIT</button>
                    </div>
                </div>
            </div>

            <!-- Receipt Print Format Selector -->
            <div>
                <label class="text-xs font-semibold text-gray-600 uppercase">Print Format</label>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button id="btn-print-58mm" onclick="setPrintFormat('58mm')" class="print-fmt-btn border-2 border-emerald-600 bg-emerald-50 text-emerald-700 font-bold py-2 text-xs rounded-lg text-center">58mm Thermal</button>
                    <button id="btn-print-a4" onclick="setPrintFormat('A4')" class="print-fmt-btn border border-gray-300 text-gray-700 font-bold py-2 text-xs rounded-lg text-center">A4 Invoice</button>
                </div>
            </div>

            <!-- Multi-Channel Receipt Action Buttons -->
            <div class="space-y-2 pt-2 border-t border-gray-200">
                <button onclick="processSale('PRINT')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold text-sm shadow flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span>Print Receipt</span>
                </button>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="processSale('WHATSAPP')" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold text-xs flex items-center justify-center space-x-1">
                        <span>Send WhatsApp</span>
                    </button>
                    <button onclick="processSale('EMAIL')" class="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold text-xs flex items-center justify-center space-x-1">
                        <span>Send Email</span>
                    </button>
                </div>

                <button onclick="closePaymentModal()" class="w-full border border-gray-300 text-gray-700 py-2 rounded-lg font-semibold text-xs hover:bg-gray-50">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Hidden Template: Thermal Printable Receipt (58mm) -->
    <template id="template-receipt-58mm">
        <div style="width: 58mm; padding: 4px; font-family: monospace; font-size: 10px; color: black; line-height: 1.2;">
            <div style="text-align: center;">
                <img src="PCBH_LOGO-BG.png" alt="Logo" style="height: 48px; margin: 0 auto 4px auto; display: block; object-fit: contain;">
                <div style="font-weight: bold; font-size: 12px; text-transform: uppercase;">BARAKAT PERFUMES</div>
                <div>District 1, Janabiya</div>
                <div>CR: 13812-04</div>
                <div>Tel: 36051011</div>
            </div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div>
                <div><strong>Customer:</strong> <span class="t-cust-name">Walk-in Customer</span></div>
                <div><strong>Phone:</strong> <span class="t-cust-phone">N/A</span></div>
            </div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div class="t-items-list" style="display: flex; flex-direction: column; gap: 4px;"></div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div>
                <div style="display: flex; justify-content: space-between;"><span>Points Earned:</span><span class="t-pts-earned">0</span></div>
                <div style="display: flex; justify-content: space-between; font-weight: bold;"><span>Points Balance:</span><span class="t-pts-balance">0</span></div>
            </div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="display: flex; justify-content: space-between;"><span>Gross Total:</span><span class="t-gross"></span></div>
                <div class="t-disc-row" style="display: flex; justify-content: space-between; color: black;"><span>Discount:</span><span class="t-disc-val"></span></div>
                <div style="display: flex; justify-content: space-between;"><span>Subtotal (Excl. VAT):</span><span class="t-subtotal"></span></div>
                <div style="display: flex; justify-content: space-between;"><span>VAT (10% Incl.):</span><span class="t-vat"></span></div>
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 11px; border-top: 1px solid black; padding-top: 2px;"><span>TOTAL BILL:</span><span class="t-total"></span></div>
            </div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div>
                <div style="font-weight: bold; margin-bottom: 2px;">Payment Method(s):</div>
                <div class="t-payments-breakdown" style="display: flex; flex-direction: column; gap: 2px;"></div>
            </div>
            <div style="border-bottom: 1px dashed black; margin: 6px 0;"></div>
            <div style="text-align: center; display: flex; flex-direction: column; gap: 3px;">
                <div style="font-weight: bold;">Thank you for shopping!</div>
                <div>Follow us:</div>
                <div>Instagram: @perfume_club.bh</div>
                <div>www.theperfumesclub.com</div>
                <div>WhatsApp: 36051011</div>
                <div style="font-size: 8px; margin-top: 4px;">Return Policy: Returns accepted within 3 days with unopened box and original receipt. No returns or exchanges on discounted items.</div>
                <div style="font-size: 8px; font-weight: bold; margin-top: 4px;" class="t-timestamp"></div>
            </div>
        </div>
    </template>

    <!-- Hidden Template: Single-Page A4 Tax Invoice (Compact Fit) -->
    <template id="template-receipt-a4">
        <div style="width: 100%; max-width: 800px; margin: 0 auto; padding: 12px; font-family: sans-serif; font-size: 11px; color: #111827; background: white; box-sizing: border-box;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #047857; padding-bottom: 8px;">
                <div>
                    <h1 style="font-size: 18px; font-weight: 900; color: #065f46; margin: 0;">BARAKAT PERFUMES</h1>
                    <p style="margin: 1px 0; color: #4b5563; font-size: 10px;">Branch: District 1, Janabiya | CR: 13812-04 | Tel: 36051011</p>
                </div>
                <div style="text-align: right;">
                    <img src="PCBH_LOGO-BG.png" alt="Logo" style="height: 40px; margin-left: auto; object-fit: contain;">
                    <p style="font-weight: bold; margin: 0; color: #1f2937; font-size: 11px;">TAX INVOICE</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin: 8px 0; padding: 8px; background: #f9fafb; border-radius: 6px; font-size: 10px;">
                <div>
                    <span style="font-weight: bold; color: #374151;">Customer: </span>
                    <strong class="t-cust-name" style="color: #111827;">Walk-in Customer</strong>
                    <span style="margin-left: 12px; color: #4b5563;">Phone: <span class="t-cust-phone">N/A</span></span>
                </div>
                <div style="text-align: right;">
                    <span style="font-weight: bold; color: #374151;">Date: </span>
                    <span class="t-timestamp" style="color: #4b5563;"></span>
                </div>
            </div>

            <table style="width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 10px;">
                <thead>
                    <tr style="background: #047857; color: white; text-align: left;">
                        <th style="padding: 6px;">Item Description</th>
                        <th style="padding: 6px; text-align: center;">Qty</th>
                        <th style="padding: 6px; text-align: right;">Unit Price</th>
                        <th style="padding: 6px; text-align: right;">Total (BHD)</th>
                    </tr>
                </thead>
                <tbody class="t-items-table-body" style="border-bottom: 1px solid #e5e7eb;"></tbody>
            </table>

            <div style="margin: 6px 0; padding: 6px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 4px; display: flex; justify-content: space-between; font-size: 10px;">
                <span>Loyalty Points Earned: <strong class="t-pts-earned">0</strong></span>
                <span>Total Points Balance: <strong class="t-pts-balance">0</strong></span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #d1d5db; font-size: 10px;">
                <div>
                    <p style="font-weight: bold; color: #374151; margin: 0 0 4px 0;">Payment Method(s):</p>
                    <div class="t-payments-breakdown" style="background: #f9fafb; padding: 6px; border-radius: 4px;"></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 2px; text-align: right;">
                    <div style="display: flex; justify-content: space-between;"><span>Gross Total:</span><span class="t-gross font-mono"></span></div>
                    <div class="t-disc-row" style="display: flex; justify-content: space-between; color: #dc2626;"><span>Discount:</span><span class="t-disc-val font-mono"></span></div>
                    <div style="display: flex; justify-content: space-between;"><span>Subtotal (Excl. VAT):</span><span class="t-subtotal font-mono"></span></div>

// --- CART & DISCOUNT ENGINE ---
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return alert('Item not found!');

    const cartItem = cart.find(item => item.id === productId);
    if (cartItem) {
        cartItem.qty++;
    } else {
        cart.push({ ...product, qty: 1 });
    }
    updateCartUI();
}

function updateCartQuantity(productId, change) {
    const cartItem = cart.find(item => item.id === productId);
    if (!cartItem) return;

    cartItem.qty += change;
    if (cartItem.qty <= 0) {
        cart = cart.filter(item => item.id !== productId);
    }
    updateCartUI();
}

function clearCart() {
    cart = [];
    currentCustomerPoints = 0;
    pointsRedeemedCount = 0;

}

        btnBhd.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-gray-200 text-gray-700';

    updateCartUI();
}

function updateCartUI() {
    const cartContainer = document.getElementById('cart-items');
    cartContainer.innerHTML = '';
    
    grossTotal = 0;
    cart.forEach(item => {
        const itemTotal = (item.retail_price || 0) * item.qty;
        grossTotal += itemTotal;
        cartContainer.innerHTML += `
            <div class="flex items-center justify-between pt-2">
                <div class="flex-1 pr-2">
                    <h5 class="text-xs font-bold text-gray-800">${item.name}</h5>
                    <p class="text-[11px] text-gray-500">${formatBHD(item.retail_price)} × ${item.qty}</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="updateCartQuantity('${item.id}', -1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded flex items-center justify-center">-</button>
                    <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                    <button onclick="updateCartQuantity('${item.id}', 1)" class="w-6 h-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded flex items-center justify-center">+</button>
                </div>
            </div>

    const customTitle = document.getElementById('discount-title').value.trim();
    const discLabel = customTitle !== '' ? customTitle : 'Discount';

    if (discountType === 'FIXED') {
        discountAmount = Math.min(inputVal, grossTotal);
    } else {
        discountAmount = grossTotal * (Math.min(inputVal, 100) / 100);

    netTotalInclusive = Math.max(0, grossTotal - discountAmount);
    const subtotalExclVat = netTotalInclusive / 1.10;

// --- SEARCH ENGINE ---
function filterProducts() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    const filtered = products.filter(p => 
        (p.name && p.name.toLowerCase().includes(query)) || 
        (p.sku && p.sku.toLowerCase().includes(query)) ||
        (p.barcode && p.barcode.toLowerCase().includes(query))
    );
    
    if (filtered.length === 1 && ((filtered[0].sku && filtered[0].sku.toLowerCase() === query) || (filtered[0].barcode && filtered[0].barcode.toLowerCase() === query))) {
        addToCart(filtered[0].id);
        document.getElementById('search-input').value = '';
        renderProducts(products);
        return;
    }
    renderProducts(filtered);
}

    const priInput = parseFloat(document.getElementById('split-pri-amount').value) || 0;
    const remaining = netTotalInclusive - priInput;
    document.getElementById('split-remaining-balance').innerText = formatBHD(remaining > 0 ? remaining : 0);

// --- SALE PROCESSING & MULTI-CHANNEL DISPATCH ---
function processSale(actionChannel = 'PRINT') {
    let paymentBreakdownText = '';
    let paymentBreakdownHTML = '';

    if (selectedPaymentType === 'SINGLE') {
        if (singlePaymentMethod === 'CASH') {
            const tendered = parseFloat(document.getElementById('cash-tendered').value) || 0;
            if (tendered < netTotalInclusive) {
                alert('Tendered cash amount is less than total due.');
                return;
            }
            const change = tendered - netTotalInclusive;
            paymentBreakdownHTML = `
                <div style="display: flex; justify-content: space-between;"><span>CASH:</span><span>${formatBHD(netTotalInclusive)}</span></div>
                <div style="display: flex; justify-content: space-between; color: #6b7280;"><span>Tendered:</span><span>${formatBHD(tendered)}</span></div>
                <div style="display: flex; justify-content: space-between; color: #6b7280;"><span>Change:</span><span>${formatBHD(change)}</span></div>
            `;
            paymentBreakdownText = `CASH: ${formatBHD(netTotalInclusive)} (Tendered: ${formatBHD(tendered)}, Change: ${formatBHD(change)})`;
        } else {
            paymentBreakdownHTML = `<div style="display: flex; justify-content: space-between;"><span>${singlePaymentMethod}:</span><span>${formatBHD(netTotalInclusive)}</span></div>`;
            paymentBreakdownText = `${singlePaymentMethod}: ${formatBHD(netTotalInclusive)}`;
        }
    } else { // SPLIT PAYMENT
        const priAmount = parseFloat(document.getElementById('split-pri-amount').value) || 0;
        if (priAmount <= 0 || priAmount >= netTotalInclusive) {
            alert('Please enter a valid partial primary amount.');
            return;
        }
        const remAmount = netTotalInclusive - priAmount;
        paymentBreakdownHTML = `
            <div style="display: flex; justify-content: space-between;"><span>${splitPrimaryMethod}:</span><span>${formatBHD(priAmount)}</span></div>
            <div style="display: flex; justify-content: space-between;"><span>${splitSecondaryMethod}:</span><span>${formatBHD(remAmount)}</span></div>
        `;
        paymentBreakdownText = `${splitPrimaryMethod}: ${formatBHD(priAmount)} | ${splitSecondaryMethod}: ${formatBHD(remAmount)}`;
    }

    // Customer & Loyalty calculation
    const custName = document.getElementById('cust-name-input').value.trim() || 'Walk-in Customer';
    const custPhone = document.getElementById('cust-phone-input').value.trim() || 'N/A';
    
    const ptsEarned = Math.floor(netTotalInclusive);
    const finalPointsBalance = Math.max(0, currentCustomerPoints - pointsRedeemedCount) + ptsEarned;

    // Math summaries
    const subtotalExclVat = netTotalInclusive / 1.10;
    const vatIncluded = netTotalInclusive - subtotalExclVat;
    const timestampStr = new Date().toLocaleString('en-GB');

    // Build Receipt Text Summary (for WhatsApp / Email)
    let receiptSummaryText = `*BARAKAT PERFUMES - RECEIPT*\n`;
    receiptSummaryText += `Date: ${timestampStr}\n`;
    receiptSummaryText += `Customer: ${custName} (${custPhone})\n`;
    receiptSummaryText += `------------------------------\n`;
    cart.forEach(item => {
        receiptSummaryText += `${item.name} x${item.qty} = ${formatBHD(item.retail_price * item.qty)}\n`;
    });
    receiptSummaryText += `------------------------------\n`;
    receiptSummaryText += `Gross Total: ${formatBHD(grossTotal)}\n`;
    if (discountAmount > 0) {
        const customTitle = document.getElementById('discount-title').value.trim();
        receiptSummaryText += `Discount (${customTitle || 'Discount'}): -${formatBHD(discountAmount)}\n`;
    }
    receiptSummaryText += `*TOTAL BILL: ${formatBHD(netTotalInclusive)}*\n`;
    receiptSummaryText += `Payment: ${paymentBreakdownText}\n`;
    receiptSummaryText += `Points Earned: ${ptsEarned} | Total Balance: ${finalPointsBalance}\n`;
    receiptSummaryText += `Thank you for shopping with Barakat Perfumes!`;

    // HANDLE MULTI-CHANNEL ACTIONS
    if (actionChannel === 'WHATSAPP') {
        const cleanPhone = custPhone.replace(/[^0-9]/g, '');
        const targetPhone = cleanPhone.length >= 8 ? (cleanPhone.startsWith('973') ? cleanPhone : '973' + cleanPhone) : '';
        const waUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(receiptSummaryText)}`;
        window.open(waUrl, '_blank');
    } else if (actionChannel === 'EMAIL') {
        const mailtoUrl = `mailto:?subject=${encodeURIComponent('Barakat Perfumes - Receipt')}&body=${encodeURIComponent(receiptSummaryText)}`;
        window.location.href = mailtoUrl;
    }

    // PRINT RECEIPT GENERATION
    if (actionChannel === 'PRINT' || actionChannel === 'WHATSAPP' || actionChannel === 'EMAIL') {
        const templateId = selectedPrintFormat === '58mm' ? 'template-receipt-58mm' : 'template-receipt-a4';
        const templateContent = document.getElementById(templateId).content.cloneNode(true);

        templateContent.querySelector('.t-cust-name').innerText = custName;
        templateContent.querySelector('.t-cust-phone').innerText = custPhone;
        templateContent.querySelector('.t-pts-earned').innerText = ptsEarned;
        templateContent.querySelector('.t-pts-balance').innerText = finalPointsBalance;
        templateContent.querySelector('.t-gross').innerText = formatBHD(grossTotal);
        templateContent.querySelector('.t-subtotal').innerText = formatBHD(subtotalExclVat);
        templateContent.querySelector('.t-vat').innerText = formatBHD(vatIncluded);
        templateContent.querySelector('.t-total').innerText = formatBHD(netTotalInclusive);
        templateContent.querySelector('.t-timestamp').innerText = timestampStr;
        templateContent.querySelector('.t-payments-breakdown').innerHTML = paymentBreakdownHTML;

        // Handle Discount display in receipt
        const discRow = templateContent.querySelector('.t-disc-row');
        if (discountAmount > 0) {
            const customTitle = document.getElementById('discount-title').value.trim();
            const discLabel = customTitle !== '' ? customTitle : 'Discount';
            discRow.querySelector('span:first-child').innerText = discLabel + ':';
            discRow.querySelector('.t-disc-val').innerText = '-' + formatBHD(discountAmount);
        } else {
            discRow.style.display = 'none';
        }

        // Render items list based on layout
        if (selectedPrintFormat === '58mm') {
            const itemsContainer = templateContent.querySelector('.t-items-list');
            cart.forEach(item => {
                itemsContainer.innerHTML += `
                    <div>
                        <div style="font-weight: bold;">${item.name}</div>
                        <div style="display: flex; justify-content: space-between; color: #4b5563;">
                            <span>${item.qty} x ${formatBHD(item.retail_price)}</span>
                            <span>${formatBHD(item.retail_price * item.qty)}</span>
                        </div>
                    </div>
                `;
            });
        } else {
            const tableBody = templateContent.querySelector('.t-items-table-body');
            cart.forEach(item => {
                tableBody.innerHTML += `
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 4px 6px;">
                            <div style="font-weight: bold; color: #1f2937;">${item.name}</div>
                            <div style="font-size: 8px; color: #9ca3af; font-family: monospace;">SKU: ${item.sku || 'N/A'}</div>
                        </td>
                        <td style="padding: 4px 6px; text-align: center; font-weight: 600;">${item.qty}</td>
                        <td style="padding: 4px 6px; text-align: right; font-family: monospace;">${formatBHD(item.retail_price)}</td>
                        <td style="padding: 4px 6px; text-align: right; font-family: monospace; font-weight: bold;">${formatBHD(item.retail_price * item.qty)}</td>
                    </tr>
                `;
            });
        }

        if (actionChannel === 'PRINT') {
            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = '';
            printContainer.appendChild(templateContent);
            printContainer.classList.remove('hidden');

            window.print();

            printContainer.classList.add('hidden');
            printContainer.innerHTML = '';
        }
    }

    // Reset and close after completing order
    clearCart();
    closePaymentModal();
}

function switchUser() {
    alert('User switched');
}

function toggleCameraScanner() {
    alert('Camera scanner toggled');
}

// Initial Load
fetchProducts();
    </script>
</body>
</html>
